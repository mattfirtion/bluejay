name: api-search
handler: api_search.handler
runtime_version: syn-python-selenium-5.1
schedule: rate(5 minutes)
timeout_in_seconds: 30
memory_in_mb: 512
active_tracing: false
success_retention_days: 7
failure_retention_days: 31
environment_variables:
  API_URL: https://example.com
  MAX_LATENCY_MS: "3000"
alarm:
  response_plan: default
  datapoints_to_alarm: 2
  evaluation_periods: 2
# Optional: run inside the VPC (for an origin/health canary)
# vpc:
#   subnet_ids: [subnet-xxxx]
#   security_group_ids: [sg-xxxx]
