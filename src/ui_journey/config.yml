name: ui-journey
handler: ui_journey.handler
runtime_version: syn-python-selenium-5.1
schedule: rate(30 minutes)
timeout_in_seconds: 90
memory_in_mb: 960
active_tracing: false
success_retention_days: 7
failure_retention_days: 31
environment_variables:
  PAGE_URL: https://example.com
  APP_ROOT_SELECTOR: body
alarm:
  # Lower-priority plan: a failure here with http_checks passing points at the partner page.
  response_plan: partner
  datapoints_to_alarm: 2
  evaluation_periods: 2
  period_seconds: 1800
