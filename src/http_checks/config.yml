name: http-checks
handler: http_checks.handler
runtime_version: syn-python-selenium-5.1
schedule: rate(1 minute)
timeout_in_seconds: 30
memory_in_mb: 512
active_tracing: false
success_retention_days: 7
failure_retention_days: 31
# PLACEHOLDERS: replace the URLs, request body and response key with the real ones.
environment_variables:
  INDEX_JS_URL: https://search.example.com/index.js
  API_URL: https://search.example.com/api/q
  API_BODY: '{"query": "example"}'
  API_RESULTS_KEY: results
  MAX_LATENCY_MS: "3000"
  INDEX_JS_MIN_BYTES: "1000"
alarm:
  response_plan: default
  datapoints_to_alarm: 2
  evaluation_periods: 2
  period_seconds: 60
